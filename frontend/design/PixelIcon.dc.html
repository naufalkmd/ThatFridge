<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid; position:absolute; inset:0; grid-template-columns:{{ gridCols }}; grid-template-rows:{{ gridRows }};">
  <sc-for list="{{ cellStyles }}" as="c" hint-placeholder-count="64">
    <div style="{{ c }}"></div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64}}">
class Component extends DCLogic {
  renderVals() {
    const cells = this.props.cells || [];
    const cols = this.props.cols || 8;
    const rows = this.props.rows || 8;
    const cellStyles = cells.map(hex => ({ background: hex || 'transparent' }));
    return {
      gridCols: `repeat(${cols}, 1fr)`,
      gridRows: `repeat(${rows}, 1fr)`,
      cellStyles,
    };
  }
}
</script>
</body>
</html>
