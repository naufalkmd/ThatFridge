version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thatfridge_postgres
    restart: always
    environment:
      POSTGRES_DB: thatfridge
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: thatfridge_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
