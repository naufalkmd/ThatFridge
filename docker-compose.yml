services:
  postgres:
    image: postgres:16-alpine
    container_name: thatfridge_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-thatfridge}
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devuser} -d ${DB_DATABASE:-thatfridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: thatfridge_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
